<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatwoot · Omni-inbox MVP — Bloom research</title>
  <style>
    :root {
      --bg: #f5f7f9;
      --surface: #ffffff;
      --border: #e5e8eb;
      --border-soft: #eef1f4;
      --text: #1f2d3d;
      --text-muted: #6b7c8f;
      --text-faint: #93a1b0;
      --primary: #1f93ff;
      --primary-soft: #e8f4ff;
      --primary-dark: #0b7ae0;
      --success: #44ce4b;
      --success-soft: #e9f9ea;
      --warning: #f59e0b;
      --danger: #ff382d;
      --wa: #25d366;
      --tg: #2aabee;
      --max: #7c5cff;
      --email: #9aa5b1;
      --sidebar-w: 320px;
      --right-w: 300px;
      --top-h: 56px;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(31, 45, 61, 0.06);
      --shadow-md: 0 8px 24px rgba(31, 45, 61, 0.12);
      --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      font-size: 14px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    ul { list-style: none; }

    /* —— Shell —— */
    .app {
      display: grid;
      grid-template-rows: var(--top-h) 1fr;
      height: 100vh;
    }

    /* —— Top bar —— */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 180px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1f93ff, #0b6bcb);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(31, 147, 255, 0.35);
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .mvp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff7e6;
      border: 1px solid #ffe0a3;
      color: #9a6700;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .mvp-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    .top-search {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .top-search input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .top-search input:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .top-search svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
    }
    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .agent-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .avatar.sm { width: 24px; height: 24px; font-size: 10px; }
    .avatar.lg { width: 48px; height: 48px; font-size: 16px; }
    .avatar.agent { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .agent-chip span { font-size: 13px; font-weight: 600; }

    /* —— Workspace —— */
    .workspace {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--right-w);
      min-height: 0;
      height: 100%;
    }

    /* —— Left: conversation list —— */
    .inbox-pane {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .inbox-tabs {
      display: flex;
      gap: 4px;
      padding: 12px 12px 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .inbox-tab {
      flex: 1;
      padding: 8px 6px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color .15s, background .15s;
    }
    .inbox-tab:hover { color: var(--text); background: var(--bg); }
    .inbox-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: transparent;
    }
    .inbox-tab .count {
      display: inline-block;
      min-width: 18px;
      padding: 0 5px;
      margin-left: 4px;
      border-radius: 999px;
      background: var(--bg);
      font-size: 11px;
      color: var(--text-muted);
    }
    .inbox-tab.active .count {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .channel-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all .15s;
    }
    .chip:hover { border-color: #c8d1db; color: var(--text); }
    .chip.active {
      border-color: transparent;
      color: #fff;
    }
    .chip.active[data-ch="all"] { background: var(--text); }
    .chip.active[data-ch="whatsapp"] { background: var(--wa); }
    .chip.active[data-ch="telegram"] { background: var(--tg); }
    .chip.active[data-ch="max"] { background: var(--max); }
    .ch-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .ch-dot.whatsapp { background: var(--wa); }
    .ch-dot.telegram { background: var(--tg); }
    .ch-dot.max { background: var(--max); }
    .ch-dot.all { background: var(--text-faint); }
    .chip.active .ch-dot { background: rgba(255,255,255,.9); }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .conv-item {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      transition: background .12s;
      position: relative;
    }
    .conv-item:hover { background: #f8fafc; }
    .conv-item.active {
      background: var(--primary-soft);
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .conv-item.unread .conv-name { font-weight: 700; }
    .conv-item.unread .conv-preview { color: var(--text); font-weight: 500; }
    .conv-avatar-wrap { position: relative; }
    .conv-avatar-wrap .avatar {
      width: 40px;
      height: 40px;
      font-size: 13px;
    }
    .ch-badge {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: grid;
      place-items: center;
      font-size: 8px;
      color: #fff;
      font-weight: 700;
    }
    .ch-badge.whatsapp { background: var(--wa); }
    .ch-badge.telegram { background: var(--tg); }
    .ch-badge.max { background: var(--max); }
    .conv-meta { min-width: 0; }
    .conv-name {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-preview {
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .conv-labels {
      display: flex;
      gap: 4px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .label {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .label.open { background: #e8f5e9; color: #2e7d32; }
    .label.pending { background: #fff3e0; color: #e65100; }
    .label.resolved { background: #eceff1; color: #546e7a; }
    .label.order { background: #f3e8ff; color: #7c3aed; }
    .conv-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .conv-time {
      font-size: 11px;
      color: var(--text-faint);
      white-space: nowrap;
    }
    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }
    .assignee-mini {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      display: grid;
      place-items: center;
      background: #94a3b8;
    }

    /* —— Center: thread —— */
    .thread-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #f0f4f8;
    }
    .thread-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 60px;
    }
    .thread-title {
      font-weight: 700;
      font-size: 15px;
    }
    .thread-sub {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-pill.open { background: #e8f5e9; color: #2e7d32; }
    .status-pill.pending { background: #fff3e0; color: #e65100; }
    .status-pill.resolved { background: #eceff1; color: #546e7a; }
    .thread-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      transition: background .12s, border-color .12s, box-shadow .12s;
    }
    .btn:hover { background: var(--bg); }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .btn-success:hover { filter: brightness(0.95); }
    .btn-ghost {
      border-color: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .day-sep {
      align-self: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      background: rgba(255,255,255,.8);
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      margin: 4px 0;
    }
    .msg {
      display: flex;
      gap: 10px;
      max-width: min(640px, 85%);
    }
    .msg.out {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-body {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .msg.out .msg-body {
      background: var(--primary-soft);
      border-color: #cfe6ff;
    }
    .msg-author {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .msg.out .msg-author { color: var(--primary-dark); }
    .msg-text {
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-time {
      font-size: 10.5px;
      color: var(--text-faint);
      margin-top: 5px;
      text-align: right;
    }
    .msg-private {
      border-style: dashed;
      background: #fffbeb !important;
      border-color: #fcd34d !important;
    }
    .msg-private .msg-author { color: #b45309; }
    .sys-note {
      align-self: center;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255,255,255,.7);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      max-width: 90%;
      text-align: center;
    }

    .composer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px 14px;
    }
    .composer-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .composer-toolbar .btn {
      padding: 4px 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .composer-toolbar .btn.active {
      background: #fffbeb;
      color: #b45309;
      border-color: #fcd34d;
    }
    .composer-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--bg);
      line-height: 1.4;
    }
    .composer textarea:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .composer .btn-primary {
      height: 44px;
      padding: 0 18px;
      border-radius: 10px;
    }

    /* —— Right: contact —— */
    .contact-pane {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }
    .contact-head {
      padding: 20px 16px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-soft);
    }
    .contact-head .avatar {
      margin: 0 auto 10px;
    }
    .contact-name {
      font-size: 16px;
      font-weight: 700;
    }
    .contact-channel {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .contact-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      margin-bottom: 10px;
    }
    .kv {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 6px 8px;
      font-size: 13px;
    }
    .kv dt { color: var(--text-muted); }
    .kv dd { font-weight: 500; word-break: break-word; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .order-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fafbfc;
      margin-bottom: 8px;
    }
    .order-card:last-child { margin-bottom: 0; }
    .order-id {
      font-weight: 700;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .order-status {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .order-status.paid { background: #e8f5e9; color: #2e7d32; }
    .order-status.packing { background: #e3f2fd; color: #1565c0; }
    .order-status.new { background: #fff3e0; color: #e65100; }
    .order-status.delivered { background: #eceff1; color: #546e7a; }

    .contact-actions {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      border-top: 1px solid var(--border-soft);
      position: sticky;
      bottom: 0;
      background: var(--surface);
    }
    .contact-actions .btn { width: 100%; justify-content: center; }

    /* —— Empty / toast —— */
    .empty-thread {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .empty-thread h3 { color: var(--text); margin-bottom: 6px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2d3d;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 100;
      box-shadow: var(--shadow-md);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* —— Modal: Create order —— */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(440px, 100%);
      background: #fff;
      border-radius: 14px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      animation: pop .18s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .modal-body { padding: 16px; }
    .form-row {
      margin-bottom: 12px;
    }
    .form-row label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      outline: none;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .form-row textarea { min-height: 64px; resize: vertical; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border-soft);
    }

    /* —— Color helpers for avatars —— */
    .c1 { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .c2 { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
    .c3 { background: linear-gradient(135deg, #34d399, #10b981); }
    .c4 { background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
    .c5 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .c6 { background: linear-gradient(135deg, #fb7185, #f43f5e); }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 280px 1fr 0; }
      .contact-pane { display: none; }
      .workspace.right-open {
        grid-template-columns: 0 1fr 300px;
      }
      .workspace.right-open .inbox-pane { display: none; }

        if (filterTab === "mine" && c.assignee !== AGENT.id) return false;

        if (filterChannel !== "all" && c.channel !== filterChannel) return false;

          const q = searchQuery.toLowerCase();
          const hay = [c.name, c.phone, c.email, c.preview, c.city, c.shop].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;

            if (filterChannel !== "all" && c.channel !== filterChannel) return false;
            return true;
          }).length;
        $("#countMine").textContent = base("mine");
        $("#countUnassigned").textContent = base("unassigned");
        $("#countAll").textContent = base("all");

          updateCounts();
          return;

          el.className = "conv-item" + (c.id === activeId ? " active" : "") + (c.unread ? " unread" : "");

        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

        return conversations.find((c) => c.id === activeId) || null;

        activeId = id;

            return;

            sep.className = "day-sep";
            sep.textContent = m.day;
            messagesEl.appendChild(sep);
          }

                <span class="order-status ${o.status}">${escapeHtml(o.status)}</span>
              </div>
              <div class="order-meta">${escapeHtml(o.title)} · ${o.amount.toLocaleString("ru-RU")} ₽</div>
            </div>`
              )
              .join("")
          : '<div class="order-meta">Заказов пока нет</div>';

        $("#convAttrs").innerHTML = `
          <dt>Статус</dt><dd>${statusLabel(c.status)}</dd>
          <dt>Агент</dt><dd>${c.assignee === "anna" ? "Анна К." : "—"}</dd>
          <dt>Канал</dt><dd>${ch.label}</dd>
          <dt>ID</dt><dd><code style="font-size:11px">${c.id}</code></dd>
        `;
      }

      function sendMessage() {
        const c = getActive();
        if (!c) return;
        const text = composerInput.value.trim();
        if (!text) return;
        const now = new Date();
        const time = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        msgSeq += 1;
        c.messages.push({
          id: "m" + msgSeq,
          from: privateMode ? "private" : "out",
          author: AGENT.name,
          text,
          time,
          day: "Сегодня",
        });
        c.preview = (privateMode ? "[приват] " : "") + text;
        c.time = time;
        if (c.status === "resolved" && !privateMode) c.status = "open";
        composerInput.value = "";
        autoGrow();
        renderThread(c);
        renderList();
        toast(privateMode ? "Приватная заметка сохранена (local)" : "Сообщение отправлено (local mock)");
      }

      function openOrderModal() {
        const c = getActive();
        if (!c) {
          toast("Сначала выберите диалог");
          return;
        }
        $("#orderContact").value = c.name + (c.phone ? " · " + c.phone : "");
        $("#orderChannel").value = c.channel;
        $("#orderProduct").value = "";
        $("#orderAmount").value = "";
        $("#orderAddress").value = "";
        const d = new Date();
        d.setDate(d.getDate() + 1);
        $("#orderDelivery").value = d.toISOString().slice(0, 10);
        orderModal.classList.add("open");
        setTimeout(() => $("#orderProduct").focus(), 50);
      }

      function closeOrderModal() {
        orderModal.classList.remove("open");
      }

      function submitOrder() {
        const c = getActive();
        if (!c) return;
        const product = $("#orderProduct").value.trim() || "Букет (без названия)";
        const amount = Number($("#orderAmount").value) || 0;
        const source = $("#orderSource").value;
        const delivery = $("#orderDelivery").value;
        const address = $("#orderAddress").value.trim();
        const id = "BL-" + (10000 + Math.floor(Math.random() * 90000));
        c.orders = c.orders || [];
        c.orders.unshift({ id, title: product, amount, status: "new" });
        if (!c.labels.includes("order")) c.labels.push("order");
        if (!c.tags.includes(source === "flowwow" ? "Flowwow" : "direct")) {
          c.tags.push(source === "flowwow" ? "Flowwow" : "direct");
        }
        msgSeq += 1;
        const time = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        c.messages.push({
          id: "m" + msgSeq,
          from: "sys",
          text: `Создан заказ ${id}: ${product}${amount ? " · " + amount.toLocaleString("ru-RU") + " ₽" : ""}${delivery ? " · доставка " + delivery : ""}${address ? " · " + address : ""} (local mock)`,
          time,
        });
        c.preview = "Заказ " + id + " создан";
        c.time = time;
        renderContact(c);
        renderThread(c);
        renderList();
        closeOrderModal();
        toast("Заказ " + id + " создан (mock, local)");
      }

      function autoGrow() {
        const ta = composerInput;
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
      }

      // —— Events ——
      document.querySelectorAll(".inbox-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".inbox-tab").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          filterTab = btn.dataset.filter;
          renderList();
        });
      });

      document.querySelectorAll(".channel-filters .chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".channel-filters .chip").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          filterChannel = btn.dataset.ch;
          renderList();
        });
      });

      $("#searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value.trim();
        renderList();
      });

      $("#btnSend").addEventListener("click", sendMessage);
      composerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      composerInput.addEventListener("input", autoGrow);

      $("#btnPrivate").addEventListener("click", () => {
        privateMode = !privateMode;
        $("#btnPrivate").classList.toggle("active", privateMode);
        composerInput.placeholder = privateMode
          ? "Внутренняя заметка (не уйдёт клиенту)…"
          : "Написать ответ клиенту…";
      });

      $("#btnResolve").addEventListener("click", () => {
        const c = getActive();
        if (!c) return;
        c.status = c.status === "resolved" ? "open" : "resolved";
        renderThread(c);
        renderContact(c);
        renderList();
        toast(c.status === "resolved" ? "Диалог решён (mock)" : "Диалог снова открыт (mock)");
      });

      $("#btnAssignMe").addEventListener("click", () => {
        const c = getActive();
        if (!c) return;
        c.assignee = AGENT.id;
        renderThread(c);
        renderContact(c);
        renderList();
        toast("Назначено на Анну К. (local)");
      });

      $("#btnCreateOrder").addEventListener("click", openOrderModal);
      $("#btnCreateOrderSide").addEventListener("click", openOrderModal);
      $("#btnCloseModal").addEventListener("click", closeOrderModal);
      $("#btnCancelOrder").addEventListener("click", closeOrderModal);
      $("#btnSubmitOrder").addEventListener("click", submitOrder);
      orderModal.addEventListener("click", (e) => {
        if (e.target === orderModal) closeOrderModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && orderModal.classList.contains("open")) closeOrderModal();
      });

      $("#btnToggleContact").addEventListener("click", () => {
        if (window.matchMedia("(max-width: 1100px)").matches) {
          workspace.classList.toggle("right-open");
          workspace.classList.remove("chat-open");
        } else {
          toast("Панель контакта уже справа");
        }
      });

      $("#backToList").addEventListener("click", () => {
        workspace.classList.remove("chat-open", "right-open");
      });

      // Show back button on small screens
      function syncMobileChrome() {
        const small = window.matchMedia("(max-width: 720px)").matches;
        $("#backToList").style.display = small ? "inline-flex" : "none";
      }
      window.addEventListener("resize", syncMobileChrome);
      syncMobileChrome();

      // Init
      renderList();
      // Auto-open first "mine" conversation for demo punch
      const first = conversations.find((c) => c.assignee === AGENT.id && c.status !== "resolved");
      if (first) selectConversation(first.id);
    })();
  </script>
</body>
</html>
